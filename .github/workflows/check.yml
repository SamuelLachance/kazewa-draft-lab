name: Vérification du laboratoire
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: draft-lab-review
          path: dist
          retention-days: 14
